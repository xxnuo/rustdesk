services:
  rustdesk-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: rustdesk-dev-webtop
    container_name: rustdesk-dev
    privileged: true
    shm_size: "2gb"
    working_dir: /workspace
    environment:
      PUID: "${HOST_UID:-1000}"
      PGID: "${HOST_GID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      DISPLAY: ":1"
      VCPKG_ROOT: /opt/artifacts/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_INCREMENTAL: "0"
    volumes:
      - .:/workspace
      - rustdesk-dev-config:/config
      - rustdesk-dev-target:/workspace/target
      - rustdesk-dev-flutter-build:/workspace/flutter/build
    ports:
      - "${RUSTDESK_DEV_HTTP_PORT:-13000}:3000"
      - "${RUSTDESK_DEV_HTTPS_PORT:-13001}:3001"
    restart: unless-stopped

volumes:
  rustdesk-dev-config:
  rustdesk-dev-target:
  rustdesk-dev-flutter-build:
